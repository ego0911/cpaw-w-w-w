name: Build and Release Management HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all-in-one HTML
        run: npm run build
        env:
          VERSION: "v1.25.6-magic.${{ github.run_number }}"

      - name: Prepare release asset
        run: |
          mkdir -p release-dist
          cp dist/index.html release-dist/management.html
          echo "SHA256 of management.html:"
          sha256sum release-dist/management.html

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.25.6-magic.${{ github.run_number }}"
          gh release create "$TAG" release-dist/management.html \
            --title "CPAMC Usage Page $TAG" \
            --notes "CPAMC 魔改面板自动化构建发布（Commit: ${{ github.sha }}）- 内置使用统计与 Keeper 内嵌支持" \
            --latest
